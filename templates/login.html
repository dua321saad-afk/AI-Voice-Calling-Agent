{% extends "base.html" %}
{% block title %}Log In — Voice AI Agent{% endblock %}
{% block main_class %}login-page{% endblock %}

{% block content %}
<div class="login-card">
  <h1>Voice AI Agent</h1>
  <p class="subtitle">Log in to start a live conversation</p>
  <form method="POST">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">Log In</button>
  </form>
  <p class="auth-switch">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
  <p class="auth-switch"><a href="{{ url_for('admin_login') }}">Admin login →</a></p>
</div>
{% endblock %}

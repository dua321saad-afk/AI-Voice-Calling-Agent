{% extends "base.html" %}
{% block title %}Sign Up — Voice AI Agent{% endblock %}
{% block main_class %}login-page{% endblock %}

{% block content %}
<div class="login-card">
  <h1>Create Your Account</h1>
  <p class="subtitle">Sign up to talk to the voice agent</p>
  <form method="POST">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="6">

    <label for="confirm_password">Confirm Password</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="6">

    <button type="submit">Create Account</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
